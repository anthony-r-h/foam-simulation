<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simulated boxing glove compression</title>
  <style>:root {
  color-scheme: dark;
  scrollbar-gutter: stable;
  --ink: #e7e9e8;
  --muted: #b4bab8;
  --paper: #303638;
  --line: #4c5355;
  --control-line: #636b6d;
  --control: #343b3d;
  --selected: #50595b;
  --accent: #f8d84e;
  --accent-hover: #ffe875;
  --font: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 var(--font); font-variant-numeric: tabular-nums; }
h1, h2, h3, p, dl, figure { margin: 0; }
h1 { font-size: 24px; font-weight: 400; line-height: 1.4; letter-spacing: -.5px; }
h2, h3, strong { font-size: inherit; font-weight: 500; }
button, input, select { font: inherit; color: inherit; }
button, input, select { min-height: 40px; border: 1px solid var(--control-line); border-radius: 0; background: var(--control); }
input, select { width: 100%; max-width: 100%; padding: 8px 12px; }
select { text-overflow: ellipsis; }
button { padding: 8px 20px; cursor: pointer; }
button:hover { background: var(--selected); }
button.active { background: var(--selected); color: #fff; border-color: var(--muted); }
:where(button, input, select, summary):focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.page { max-width: 1040px; margin: auto; padding: 48px 48px 64px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 28px; }
.subtitle { margin-top: 8px; color: var(--muted); }
.documentation-button { flex: 0 0 auto; border-color: var(--accent); background: var(--accent); color: #242829; font-weight: 700; box-shadow: 4px 4px 0 #151819; }
.documentation-button:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
.documentation-button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #151819; }
.panel { min-width: 0; padding: 24px 0 32px; border-top: 1px solid var(--line); }
.panel > h2 { margin-bottom: 20px; }
.section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.section-heading p { color: var(--muted); }
.section-heading strong { color: var(--ink); }
.error { margin-bottom: 24px; padding: 12px 16px; border: 1px solid var(--muted); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--muted); }
.field input, .field select { color: var(--ink); }
.field-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 24px; }
.field--short { flex-direction: row; align-items: center; gap: 12px; }
.field--short select { width: auto; max-width: 240px; }
.reference-scale { padding: 0 40px; }
.reference-scale input { display: block; appearance: none; height: 40px; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; }
.reference-scale input::-webkit-slider-runnable-track { height: 2px; background: var(--control-line); }
.reference-scale input::-moz-range-track { height: 2px; background: var(--control-line); }
.reference-scale input::-webkit-slider-thumb { appearance: none; width: 20px; height: 24px; margin-top: -11px; border: 2px solid var(--ink); border-radius: 0; background: var(--ink); }
.reference-scale input::-moz-range-thumb { width: 16px; height: 20px; border: 2px solid var(--ink); border-radius: 0; background: var(--ink); }
.reference-points { position: relative; height: 32px; margin: 0 10px; }
.reference-point { position: absolute; left: var(--position); transform: translateX(-50%); text-align: center; color: var(--muted); }
.reference-point::before { content: ""; display: block; width: 1px; height: 6px; margin: 0 auto 4px; background: var(--control-line); }
.reference-point--active { color: var(--ink); font-weight: 600; }
.impact-description { position: relative; width: 80px; margin-top: 12px; left: calc(50px + (100% - 100px) * var(--impact-position)); transform: translateX(-50%); text-align: center; }

.preset-row { display: flex; align-items: center; gap: 24px; margin-bottom: 12px; }
.preset-row > span { color: var(--muted); }
.button-group { display: flex; }
.button-group button { min-width: 92px; }
.button-group button + button { margin-left: -1px; }
.layer { position: relative; padding: 16px 0 16px 28px; border-bottom: 1px solid var(--line); }
.layer:last-child { border-bottom: 0; padding-bottom: 0; }
.layer-title { display: flex; align-items: baseline; margin-bottom: 8px; }
.layer-title strong { font-size: 16px; font-weight: 600; color: #fff; }
.layer-title .swatch { position: absolute; top: 16px; bottom: 16px; left: 0; width: 10px; height: auto; }
.layer:last-child .layer-title .swatch { bottom: 0; }
.material-details { margin-top: 8px; }
.material-details summary { width: fit-content; color: var(--muted); cursor: pointer; }
.foam-data { display: grid; gap: 8px; margin-top: 12px; }
.foam-data > div { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; }
.foam-data dt { color: var(--muted); }
.foam-data dd { margin: 0; }
.swatch { display: inline-block; width: 12px; height: 12px; flex: 0 0 12px; background: var(--c); }

.empty-state { padding: 24px 0; color: var(--muted); }
[aria-busy="true"] { opacity: .55; }
.result-status { margin: 16px 0; color: var(--muted); }
.result-status--error { color: var(--ink); }
.result-list { display: grid; gap: 8px; }
.result-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 8px 24px; }
.result-row dt { color: var(--muted); }
.result-row dd { margin: 0; text-align: right; }
.result-row strong { font-weight: 400; }
.result-row small { font-size: inherit; color: var(--muted); }

/* Each shape and its callout share a row, so live labels stay attached at any size. */
.foam-response { margin-top: 40px; }
.foam-response-layer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 28px; min-height: 150px; }
.foam-shape { width: 100%; height: auto; display: block; overflow: visible; }
.response-callout { position: relative; padding: 12px 0; }
.response-callout::before { content: ""; position: absolute; left: -52px; top: 24px; width: 40px; height: 1px; background: var(--muted); }
.response-callout::after { content: ""; position: absolute; left: -55px; top: 21px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.response-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; font-size: 16px; font-weight: 600; color: #fff; }
.response-title span { font-size: 14px; font-weight: 400; color: var(--muted); }
.response-values { margin: 8px 0 0; display: grid; gap: 4px; }
.response-values > div { display: flex; gap: 8px; }
.response-values dt { color: var(--muted); }
.response-values dd { margin: 0; white-space: nowrap; }
.sample-weight { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-top: 20px; }
.sample-weight span { color: var(--muted); }
.sample-weight strong { font-weight: 400; }

.chartbox { margin-top: 24px; overflow-x: auto; }
.chartbox svg { display: block; width: 100%; height: auto; min-width: 600px; }
.chartbox text { fill: var(--muted); font: 14px var(--font); }
.chart-axis { stroke: var(--control-line); stroke-width: 1; }
.chart-line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.chart-marker { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 6; }
.chart-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 24px; padding-top: 16px; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; }
.caption { color: var(--muted); }

@media (max-width: 720px) {
  .page { padding: 28px 24px 40px; }
  .section-heading { flex-wrap: wrap; gap: 12px; }
  .foam-response-layer { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 20px; }
  .response-callout::before { left: -32px; width: 24px; }
  .response-callout::after { left: -35px; }
  .result-row { grid-template-columns: minmax(0, 1fr) minmax(0, .65fr); }
}

@media (max-width: 480px) {
  .page { padding: 24px 16px 32px; }
  h1 { font-size: 22px; }
  .top { align-items: flex-start; flex-direction: column; gap: 20px; }
  .documentation-button { width: 100%; }
  .field-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .preset-row { flex-wrap: wrap; gap: 12px; }
  .reference-scale { padding: 0 32px; }
  .reference-point { white-space: nowrap; }
  .reference-point:nth-child(even) span { display: inline-block; margin-top: 24px; }
  .reference-points { height: 56px; }
  .impact-description { left: calc(42px + (100% - 84px) * var(--impact-position)); }
  .foam-response-layer { grid-template-columns: minmax(0, 1fr); gap: 0; margin-bottom: 24px; }
  .foam-shape { max-width: 320px; margin: 0 auto; }
  .response-callout { margin-left: 20px; padding: 0 0 0 12px; border-left: 1px solid var(--muted); }
  .response-callout::before, .response-callout::after { display: none; }
  .field--short { width: 100%; }
  .field--short select { flex: 1; max-width: none; min-width: 0; }
}

@media (prefers-reduced-motion: no-preference) {
  button { transition: background-color .15s, border-color .15s; }
}
[hidden] { display: none; }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div>
      <h1>Simulated boxing glove compression</h1>
      <p class="subtitle">Explore materials, thickness, and impact response.</p>
    </div>
    <button class="documentation-button" type="button">Documentation</button>
  </header>

  <div id="error" class="error" role="alert" hidden></div>

  <section id="impact-card" class="panel">
    <h2>Impact</h2>
    <div class="reference-scale">
      <input id="impact-level" type="range" min="0" max="5" step="1" value="3" aria-label="Impact reference" aria-describedby="impact-description">
      <div id="impact-points" class="reference-points" aria-hidden="true"></div>
    </div>
    <p id="impact-description" class="impact-description" aria-live="polite"><output id="impact-energy"></output> J</p>
  </section>

  <section id="layers-card" class="panel">
    <div class="section-heading">
      <h2>Layers</h2>
      <p><strong><output id="total-thickness"></output> mm</strong> total</p>
    </div>
    <div class="preset-row">
      <span id="presets-label">Presets</span>
      <div id="preset-buttons" class="button-group" role="group" aria-labelledby="presets-label"></div>
    </div>
    <div id="layers"></div>
  </section>

  <section id="results-card" class="panel" aria-live="polite">
    <div class="section-heading">
      <h2>Results</h2>
      <p>50 mm EVA75 target</p>
    </div>
    <div id="results"></div>
  </section>

  <section id="graphs-card" class="panel">
    <div class="section-heading">
      <h2>Impact graphs</h2>
      <label class="field field--short">View
        <select id="graph-view">
          <option value="force">Force &amp; thickness</option>
          <option value="work">Work &amp; speed</option>
        </select>
      </label>
    </div>
    <p id="graph-caption" class="caption"></p>
    <div id="main-chart" class="chartbox" aria-describedby="graph-caption"></div>
  </section>

</main>

<script>/* Browser port of ../simulation.py. Keep numerical changes in parity with Python. */
'use strict';
(() => {
 const assumptions={
  dome:{curvature_radius_mm:100,footprint_radius_mm:40},
  hand_stiffness_n_per_mm:1000,
  indenter_area_m2:0.032258,
  pound_force_n:4.44822161526,
  sample_width_mm:30,
  sample_length_mm:30,
  tail_exponent:2,
  minimum_tail_strain_interval:0.04,
  reference_curves:{
   pu55:{family:'PU',solid_density_kg_m3:1200,fit_strain:0.70,relaxation_pa_s:48000,relaxing_stiffness_pa:33000,base_stiffness_pa:1600,rise_scale_pa:2450,rise_exponent:4,slow_strain_rate_per_s:0.0333},
   hr40:{family:'PU',solid_density_kg_m3:1200,fit_strain:0.70,relaxation_pa_s:130000,relaxing_stiffness_pa:1200000,base_stiffness_pa:1800,rise_scale_pa:14000,rise_exponent:2,slow_strain_rate_per_s:0.0333},
   latex85:{family:'Latex',solid_density_kg_m3:920,fit_strain:0.70,relaxation_pa_s:9000,relaxing_stiffness_pa:100000,base_stiffness_pa:6800,rise_scale_pa:14000,rise_exponent:4,slow_strain_rate_per_s:0.0333},
   eva35:{family:'EVA',solid_density_kg_m3:950,fit_strain:0.80,plateau_pa:12900,initial_rise:20,air_pressure_pa:101325,slow_leakage_ratio:0.19308}
  },
  metrics:{early_time_ms:10,loading_rate_window_ms:0.5},
  numerics:{maximum_pressure_pa:1000000000,curve_steps:600,tail_steps:160,trajectory_steps:1000}
 };

 function sum(values){return values.reduce((total,value)=>total+value,0);}

 function referenceResponse(strain,reference,fast){
  if(reference.family==='EVA'){
   const air=reference.air_pressure_pa*(fast?1:1-reference.slow_leakage_ratio);
   const shape=Math.tanh(reference.initial_rise*strain);
   const pressure=reference.plateau_pa*shape+air*strain/(1-strain);
   const slope=reference.plateau_pa*reference.initial_rise*(1-shape**2)+air/(1-strain)**2;
   return [pressure,slope];
  }
  const stiffness=reference.relaxing_stiffness_pa;
  let pressure;
  let slope;
  if(fast){
   pressure=stiffness*strain;
   slope=stiffness;
  }else{
   const relaxation=reference.relaxation_pa_s*reference.slow_strain_rate_per_s;
   pressure=relaxation*(1-Math.exp(-stiffness*strain/relaxation));
   slope=stiffness*Math.exp(-stiffness*strain/relaxation);
  }
  const shape=Math.expm1(strain);
  pressure+=reference.base_stiffness_pa*strain+reference.rise_scale_pa*strain*shape**reference.rise_exponent;
  slope+=reference.base_stiffness_pa+reference.rise_scale_pa*(shape**reference.rise_exponent+strain*reference.rise_exponent*shape**(reference.rise_exponent-1)*Math.exp(strain));
  return [pressure,slope];
 }

 function minimumSkew(reference,join,steps){
  let bound=-Infinity;
  for(const fast of [false,true]){
   const requiredSkew=strain=>{
    const [pressure,slope]=referenceResponse(strain,reference,fast);
    return -slope/pressure;
   };
   const strains=Array.from({length:steps+1},(_,index)=>join*index/steps);
   const bounds=[-Infinity,...strains.slice(1).map(requiredSkew)];
   bound=Math.max(bound,...bounds);
   for(let index=1;index<steps;index+=1){
    if(bounds[index]<bounds[index-1]||bounds[index]<bounds[index+1])continue;
    let left=strains[index-1];
    let right=strains[index+1];
    for(let iteration=0;iteration<60;iteration+=1){
     const first=left+(right-left)/3;
     const second=right-(right-left)/3;
     if(requiredSkew(first)<requiredSkew(second))left=first;
     else right=second;
    }
    bound=Math.max(bound,requiredSkew((left+right)/2));
   }
  }
  return bound+1e-10*Math.max(1,Math.abs(bound));
 }

 function materialCurve(foam,settings,fast=true){
  const reference=settings.reference_curves[foam.reference_curve];
  const anchors=foam.anchors;
  const cap=1-foam.density_kg_m3/reference.solid_density_kg_m3;
  const join=Math.min(reference.fit_strain,cap-settings.minimum_tail_strain_interval);
  if(anchors.at(-1)[0]>join){
   throw Error(`Anchor at ${anchors.at(-1)[0]*100}% exceeds the assumed tail start at ${join*100}%.`);
  }
  const observedStrains=anchors.map(anchor=>anchor[0]);
  const logRatios=anchors.map(([strain,pressure])=>Math.log(pressure/referenceResponse(strain,reference,false)[0]));
  const meanStrain=sum(observedStrains)/anchors.length;
  const meanLogRatio=sum(logRatios)/anchors.length;
  let skew=0;
  if(new Set(observedStrains).size>1){
   const covariance=sum(observedStrains.map((strain,index)=>(strain-meanStrain)*(logRatios[index]-meanLogRatio)));
   const variance=sum(observedStrains.map(strain=>(strain-meanStrain)**2));
   skew=covariance/variance;
  }
  let constrained=false;
  if(skew<0){
   const lowerBound=minimumSkew(reference,join,settings.numerics.curve_steps);
   constrained=skew<lowerBound;
   skew=Math.max(skew,lowerBound);
  }
  const scale=Math.exp(meanLogRatio-skew*meanStrain);
  const observations=anchors.map(([strain,pressure])=>{
   const fitted=scale*Math.exp(skew*strain)*referenceResponse(strain,reference,false)[0];
   return {strain,supplier_pressure_pa:pressure,fitted_pressure_pa:fitted,difference_percent:100*(fitted/pressure-1)};
  });
  const calibrated=strain=>{
   const [pressure,slope]=referenceResponse(strain,reference,fast);
   const multiplier=scale*Math.exp(skew*strain);
   return [multiplier*pressure,multiplier*(slope+skew*pressure)];
  };
  const [joinPressure,joinSlope]=calibrated(join);
  const tailLength=cap-join;
  const pressureAt=strain=>{
   if(strain<=join)return calibrated(strain)[0];
   return joinPressure+joinSlope*tailLength/settings.tail_exponent*((tailLength/(cap-strain))**settings.tail_exponent-1);
  };
  const numerics=settings.numerics;
  let low=0;
  let high=cap*(1-1e-12);
  for(let iteration=0;iteration<60;iteration+=1){
   const middle=(low+high)/2;
   if(pressureAt(middle)<numerics.maximum_pressure_pa)low=middle;
   else high=middle;
  }
  const endStrain=(low+high)/2;
  const baseEnd=Math.min(join,endStrain);
  const strains=Array.from({length:numerics.curve_steps+1},(_,index)=>baseEnd*index/numerics.curve_steps);
  strains.push(...anchors.filter(([strain])=>strain<endStrain).map(([strain])=>strain));
  if(endStrain>join){
   for(let index=1;index<=numerics.tail_steps;index+=1){
    const fraction=index/numerics.tail_steps;
    strains.push(cap-tailLength*((cap-endStrain)/tailLength)**fraction);
   }
  }
  strains.push(endStrain);
  const uniqueStrains=[...new Set(strains)].sort((left,right)=>left-right);
  const pressures=uniqueStrains.map(pressureAt);
  pressures[pressures.length-1]=numerics.maximum_pressure_pa;
  const work=[0];
  for(let index=1;index<uniqueStrains.length;index+=1){
   work.push(work.at(-1)+(pressures[index-1]+pressures[index])/2*(uniqueStrains[index]-uniqueStrains[index-1]));
  }
  return {strain:uniqueStrains,pressure_pa:pressures,work_density_j_m3:work,join_strain:join,cap_strain:cap,anchors,fit:{scale,skew,constrained,observations}};
 }

 function interval(values,value){
  let low=0;
  let high=values.length;
  while(low<high){
   const middle=Math.floor((low+high)/2);
   if(value<values[middle])high=middle;
   else low=middle+1;
  }
  const index=Math.min(values.length-2,Math.max(0,low-1));
  return [index,(value-values[index])/(values[index+1]-values[index])];
 }

 function segmentIntegrals(column,foams,index,distance){
  const start=column.shortening_m[index];
  const width=column.shortening_m[index+1]-start;
  const pressure=column.pressure_pa[index];
  const slope=(column.pressure_pa[index+1]-pressure)/width;
  const pressureIntegral=pressure*distance+slope*distance**2/2;
  const pressureMoment=start*pressureIntegral+pressure*distance**2/2+slope*distance**3/3;
  const workIntegrals=[];
  const workMoments=[];
  for(let foamIndex=0;foamIndex<foams.length;foamIndex+=1){
   const strainChange=column.strain[foamIndex][index+1]-column.strain[foamIndex][index];
   const share=foams[foamIndex].thickness_mm/1000*strainChange/width;
   const work=column.work_j_m2[foamIndex][index];
   const integral=work*distance+share*(pressure*distance**2/2+slope*distance**3/6);
   let moment=start*integral+work*distance**2/2;
   moment+=share*(pressure*distance**3/3+slope*distance**4/8);
   workIntegrals.push(integral);
   workMoments.push(moment);
  }
  return [pressureIntegral,pressureMoment,workIntegrals,workMoments];
 }

 function prepareIntegrals(column,foams){
  const pressure=[0];
  const pressureMoment=[0];
  const work=foams.map(()=>[0]);
  const workMoment=foams.map(()=>[0]);
  for(let index=0;index<column.shortening_m.length-1;index+=1){
   const width=column.shortening_m[index+1]-column.shortening_m[index];
   const [integralP,momentP,integralsW,momentsW]=segmentIntegrals(column,foams,index,width);
   pressure.push(pressure.at(-1)+integralP);
   pressureMoment.push(pressureMoment.at(-1)+momentP);
   for(let foamIndex=0;foamIndex<foams.length;foamIndex+=1){
    work[foamIndex].push(work[foamIndex].at(-1)+integralsW[foamIndex]);
    workMoment[foamIndex].push(workMoment[foamIndex].at(-1)+momentsW[foamIndex]);
   }
  }
  column.integrals={pressure,pressure_moment:pressureMoment,work,work_moment:workMoment};
 }

 function prepareColumn(foams,curves){
  const pressures=[...new Set(curves.flatMap(curve=>curve.pressure_pa))].sort((left,right)=>left-right);
  const strains=[];
  const works=[];
  for(let foamIndex=0;foamIndex<foams.length;foamIndex+=1){
   const foam=foams[foamIndex];
   const curve=curves[foamIndex];
   const layerStrains=[];
   const layerWorks=[];
   const thickness=foam.thickness_mm/1000;
   for(const pressure of pressures){
    const [index,fraction]=interval(curve.pressure_pa,pressure);
    const strain=curve.strain[index]+fraction*(curve.strain[index+1]-curve.strain[index]);
    let work=curve.work_density_j_m3[index];
    work+=(curve.pressure_pa[index]+pressure)/2*(strain-curve.strain[index]);
    layerStrains.push(strain);
    layerWorks.push(thickness*work);
   }
   strains.push(layerStrains);
   works.push(layerWorks);
  }
  const shortening=pressures.map((_,index)=>sum(foams.map((foam,foamIndex)=>foam.thickness_mm/1000*strains[foamIndex][index])));
  const column={pressure_pa:pressures,shortening_m:shortening,strain:strains,work_j_m2:works};
  prepareIntegrals(column,foams);
  return column;
 }

 function columnIntegrals(shortening,column,foams){
  const [index]=interval(column.shortening_m,shortening);
  const distance=shortening-column.shortening_m[index];
  const result=segmentIntegrals(column,foams,index,distance);
  const prefix=column.integrals;
  result[0]+=prefix.pressure[index];
  result[1]+=prefix.pressure_moment[index];
  for(let foamIndex=0;foamIndex<foams.length;foamIndex+=1){
   result[2][foamIndex]+=prefix.work[foamIndex][index];
   result[3][foamIndex]+=prefix.work_moment[foamIndex][index];
  }
  return result;
 }

 function columnState(shortening,column,foams){
  const [index,fraction]=interval(column.shortening_m,shortening);
  const pressure=column.pressure_pa[index]+fraction*(column.pressure_pa[index+1]-column.pressure_pa[index]);
  const strains=[];
  const works=[];
  for(let foamIndex=0;foamIndex<foams.length;foamIndex+=1){
   const strain=column.strain[foamIndex][index]+fraction*(column.strain[foamIndex][index+1]-column.strain[foamIndex][index]);
   let work=column.work_j_m2[foamIndex][index];
   work+=(column.pressure_pa[index]+pressure)/2*foams[foamIndex].thickness_mm/1000*(strain-column.strain[foamIndex][index]);
   strains.push(strain);
   works.push(work);
  }
  return [pressure,strains,works];
 }

 function contactState(advance,column,foams,settings){
  const radius=settings.dome.curvature_radius_mm/1000;
  const face=settings.dome.footprint_radius_mm/1000;
  const edgeGap=radius-Math.sqrt(radius**2-face**2);
  const contactRadiusSquared=advance<edgeGap?2*radius*advance-advance**2:face**2;
  const area=Math.PI*contactRadiusSquared;
  const low=columnIntegrals(Math.max(0,advance-edgeGap),column,foams);
  const high=columnIntegrals(advance,column,foams);
  const force=2*Math.PI*((radius-advance)*(high[0]-low[0])+high[1]-low[1]);
  const works=foams.map((_,index)=>2*Math.PI*((radius-advance)*(high[2][index]-low[2][index])+high[3][index]-low[3][index]));
  const [centerPressure,strains]=columnState(advance,column,foams);
  const handM=force/(settings.hand_stiffness_n_per_mm*1000);
  const handWork=force*handM/2;
  return {dome_m:advance,mass_m:advance+handM,force_n:force,area_m2:area,center_pressure_pa:centerPressure,strain:strains,foam_work_j:works,hand_m:handM,hand_work_j:handWork,total_work_j:sum(works)+handWork};
 }

 function traceRow(state,foams,massKg,incomingSpeed,speed,timeS){
  const components=foams.map((foam,index)=>{
   const compression=foam.thickness_mm*state.strain[index];
   return {strain:state.strain[index],compression_mm:compression,remaining_mm:foam.thickness_mm-compression,work_j:state.foam_work_j[index]};
  });
  const gloveCompression=sum(components.slice(0,-1).map(layer=>layer.compression_mm));
  const gloveThickness=sum(foams.slice(0,-1).map(foam=>foam.thickness_mm));
  return {time_s:timeS,force_n:state.force_n,speed_m_s:speed,kinetic_energy_j:massKg*speed**2/2,loading_impulse_n_s:massKg*(incomingSpeed-speed),dome_advance_mm:state.dome_m*1000,mass_advance_mm:state.mass_m*1000,contact_area_mm2:state.area_m2*1e6,center_pressure_pa:state.center_pressure_pa,glove_compression_mm:gloveCompression,glove_remaining_mm:gloveThickness-gloveCompression,glove_remaining_percent:100*(1-gloveCompression/gloveThickness),glove_work_j:sum(state.foam_work_j.slice(0,-1)),total_work_j:state.total_work_j,layers:components.slice(0,-1),target:components.at(-1),hand:{compression_mm:state.hand_m*1000,work_j:state.hand_work_j}};
 }

 function interpolate(xValues,yValues,x){
  const [index,fraction]=interval(xValues,x);
  return yValues[index]+fraction*(yValues[index+1]-yValues[index]);
 }

 function peakWindowRate(times,forces,windowS){
  if(times.at(-1)<windowS)return null;
  const lastStart=times.at(-1)-windowS;
  const starts=[0,lastStart];
  starts.push(...times.filter(time=>time>0&&time<lastStart));
  starts.push(...times.map(time=>time-windowS).filter(time=>time>0&&time<lastStart));
  return Math.max(...starts.map(start=>(interpolate(times,forces,start+windowS)-interpolate(times,forces,start))/windowS));
 }

 function summarize(rows,foams,curves,settings,energy,complete){
  const end=rows.at(-1);
  const times=rows.map(row=>row.time_s);
  const forces=rows.map(row=>row.force_n);
  const earlyS=settings.metrics.early_time_ms/1000;
  const windowS=settings.metrics.loading_rate_window_ms/1000;
  const sampleArea=settings.sample_width_mm*settings.sample_length_mm/1e6;
  const weightG=sum(foams.slice(0,-1).map(foam=>foam.density_kg_m3*sampleArea*foam.thickness_mm));
  const metrics={peak_force_n:null,time_to_peak_s:null,loading_rate_10_90_n_s:null,peak_loading_rate_n_s:null,loading_rate_window_s:windowS,force_at_5ms_n:null,loading_impulse_n_s:null,speed_at_peak_m_s:null,maximum_glove_compression_mm:null,maximum_glove_compression_percent:null,minimum_glove_thickness_mm:null,foam_sample_weight_g:weightG,early_time_s:earlyS,early_force_n:null,early_force_percent_of_peak:null,early_sample_time_s:null,peak_before_early_time:null,force_at_early_time_n:null,kinetic_energy_at_early_time_j:null,kinetic_energy_at_early_time_percent:null,components:null};
  if(end.time_s>=0.005)metrics.force_at_5ms_n=interpolate(times,forces,0.005);
  if(end.time_s>=earlyS){
   metrics.force_at_early_time_n=interpolate(times,forces,earlyS);
   const kinetic=interpolate(times,rows.map(row=>row.kinetic_energy_j),earlyS);
   metrics.kinetic_energy_at_early_time_j=kinetic;
   metrics.kinetic_energy_at_early_time_percent=100*kinetic/energy;
  }
  if(!complete)return metrics;
  const peak=end.force_n;
  const t10=interpolate(forces,times,0.1*peak);
  const t90=interpolate(forces,times,0.9*peak);
  const sampleTime=Math.min(earlyS,end.time_s);
  const earlyForce=interpolate(times,forces,sampleTime);
  const states=[...end.layers,end.target];
  const components=foams.map((foam,index)=>({role:foam.role,layer:foam.layer??null,foam_id:foam.foam_id,compression_mm:states[index].compression_mm,remaining_mm:states[index].remaining_mm,strain:states[index].strain,work_j:states[index].work_j,work_share_percent:100*states[index].work_j/energy,beyond_reference_fit:states[index].strain>curves[index].join_strain}));
  components.push({role:'hand',compression_mm:end.hand.compression_mm,work_j:end.hand.work_j,work_share_percent:100*end.hand.work_j/energy});
  Object.assign(metrics,{peak_force_n:peak,time_to_peak_s:end.time_s,loading_rate_10_90_n_s:0.8*peak/(t90-t10),peak_loading_rate_n_s:peakWindowRate(times,forces,windowS),loading_impulse_n_s:end.loading_impulse_n_s,speed_at_peak_m_s:end.speed_m_s,maximum_glove_compression_mm:end.glove_compression_mm,maximum_glove_compression_percent:100-end.glove_remaining_percent,minimum_glove_thickness_mm:end.glove_remaining_mm,early_force_n:earlyForce,early_force_percent_of_peak:100*earlyForce/peak,early_sample_time_s:sampleTime,peak_before_early_time:end.time_s<earlyS,components});
  return metrics;
 }

 function prepareFoams(request,catalog,settings){
  const catalogById=new Map(catalog.map(foam=>[foam.id,foam]));
  const requested=[...request.layers.map(layer=>({...layer,role:'glove'})),{...request.target,role:'target'}];
  const foams=[];
  const errors=[];
  for(const item of requested){
   const entry=catalogById.get(item.foam_id);
   const missing=[];
   if(!entry?.referenceCurve)missing.push('reference_curve');
   if(!entry?.densityKgM3)missing.push('density_kg_m3');
   if(!entry?.firmnessUnits)missing.push('firmness_units');
   if(!entry?.firmness?.length)missing.push('firmness_p1_value','firmness_p1_at_pct');
   if(missing.length){
    errors.push({foam_id:item.foam_id,role:item.role,layer:item.layer??null,missing_fields:missing});
    continue;
   }
   const conversions={Pa:1,kPa:1000,N:1/settings.indenter_area_m2,lbf:settings.pound_force_n/settings.indenter_area_m2};
   const conversion=conversions[entry.firmnessUnits];
   const anchors=entry.firmness.map(point=>[point.compressionPercent/100,point.value*conversion]).sort((left,right)=>left[0]-right[0]);
   if(anchors.some(([strain,pressure])=>strain<=0||strain>=1||pressure<=0)){
    return {error:{status:'error',reason:'invalid anchors',foam_id:item.foam_id,message:'Observations must have positive pressures and compression percentages between 0 and 100.'}};
   }
   foams.push({...item,materials:[entry.name],family:entry.family,subtype:entry.subtype,reference_curve:entry.referenceCurve,density_kg_m3:entry.densityKgM3,anchors,firmness_units:entry.firmnessUnits});
  }
  return errors.length?{error:{status:'error',reason:'incomplete data',errors}}:{foams};
 }

 function simulate(request,catalog,settings=assumptions){
  const prepared=prepareFoams(request,catalog,settings);
  if(prepared.error)return prepared.error;
  const foams=prepared.foams;
  const curves=[];
  for(const foam of foams){
   try{curves.push(materialCurve(foam,settings));}
   catch(error){return {status:'error',reason:'invalid foam curve',foam_id:foam.foam_id,message:error.message};}
  }
  const column=prepareColumn(foams,curves);
  const energy=request.mass_kg*request.speed_m_s**2/2;
  let low=0;
  let high=column.shortening_m.at(-1);
  let end=contactState(high,column,foams,settings);
  const complete=end.total_work_j>=energy;
  if(complete){
   for(let iteration=0;iteration<50;iteration+=1){
    const middle=(low+high)/2;
    const state=contactState(middle,column,foams,settings);
    if(state.total_work_j<energy)low=middle;
    else high=middle;
   }
   end=contactState((low+high)/2,column,foams,settings);
  }
  let previous=contactState(0,column,foams,settings);
  let previousSpeed=request.speed_m_s;
  let timeS=0;
  const rows=[traceRow(previous,foams,request.mass_kg,request.speed_m_s,previousSpeed,timeS)];
  const steps=settings.numerics.trajectory_steps;
  for(let index=1;index<=steps;index+=1){
   const fraction=index/steps;
   const advance=end.dome_m*(2*fraction-fraction**2);
   const state=index===steps?end:contactState(advance,column,foams,settings);
   let speed=Math.sqrt(2*Math.max(0,energy-state.total_work_j)/request.mass_kg);
   if(index===steps&&complete)speed=0;
   timeS+=2*(state.mass_m-previous.mass_m)/(previousSpeed+speed);
   rows.push(traceRow(state,foams,request.mass_kg,request.speed_m_s,speed,timeS));
   previous=state;
   previousSpeed=speed;
  }
  let numericalImpulse=0;
  for(let index=1;index<rows.length;index+=1){
   numericalImpulse+=(rows[index-1].force_n+rows[index].force_n)/2*(rows[index].time_s-rows[index-1].time_s);
  }
  return {status:complete?'complete':'incomplete',reason:complete?null:'Numerical pressure range ended before the striker stopped.',punch:{mass_kg:request.mass_kg,speed_m_s:request.speed_m_s,energy_j:energy},foams,assumptions:settings,metrics:summarize(rows,foams,curves,settings,energy,complete),trace:rows,reached:rows.at(-1),curves:curves.map((curve,index)=>({foam_id:foams[index].foam_id,role:foams[index].role,layer:foams[index].layer,fast:curve})),checks:{energy_residual_j:energy-end.total_work_j-rows.at(-1).kinetic_energy_j,integrated_force_n_s:numericalImpulse,impulse_residual_n_s:numericalImpulse-rows.at(-1).loading_impulse_n_s}};
 }

 function frontendResult(result){
  const response={};
  for(const key of ['status','reason','message','errors','metrics']){
   if(key in result)response[key]=result[key];
  }
  const trace=result.trace||[];
  const step=Math.max(1,Math.floor(trace.length/250));
  const rows=[];
  for(let index=0;index<trace.length;index+=step)rows.push(trace[index]);
  if(trace.length&&rows.at(-1)!==trace.at(-1))rows.push(trace.at(-1));
  response.trace=rows.map(row=>({time_s:row.time_s,force_n:row.force_n,speed_m_s:row.speed_m_s,glove_work_j:row.glove_work_j,glove_remaining_percent:row.glove_remaining_percent,layers:row.layers.map(layer=>({remaining_mm:layer.remaining_mm}))}));
  return response;
 }

 globalThis.FoamSimulation=Object.freeze({assumptions,simulate,simulateFrontend:(request,catalog)=>frontendResult(simulate(request,catalog)),frontendResult});
})();
</script>
<script>/* Catalog-backed inputs for the browser simulation. */
'use strict';
(() => {
 const $=id=>document.getElementById(id);
 const esc=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
 const catalog=JSON.parse($('foam-catalog').textContent);
 const catalogById=new Map(catalog.map(foam=>[foam.id,foam]));
 const materialGroups=['EVA','Latex','High-resilience PU','Other PU'];
 const catalogByGroup=new Map(materialGroups.map(group=>[
  group,
  catalog.filter(foam=>materialGroup(foam)===group).sort((a,b)=>a.name.localeCompare(b.name))
 ]));
 const colors=['#d7c3a6','#a5c7da','#d6a5bb','#a4cdb9'];
 const target=Object.freeze({foam_id:'cutfoam-eva75',thickness_mm:50});
 const impactLevels=[
  {label:'Light',energy:5},
  {label:'Child',energy:20},
  {label:'Developing',energy:45},
  {label:'Adult',speed:7.7},
  {label:'Boxer',energy:121},
  {label:'Gorilla',energy:200}
 ];
 const presets=[
  {id:'soft',label:'Soft',layers:[
   ['foam-factory-dunlop-latex-29-ild',20],
   ['foamonline-high-resilience-very-soft',20],
   ['evazote-ev50',5],
   ['foam-factory-super-soft',5]
  ]},
  {id:'medium',label:'Medium',layers:[
   ['foam-factory-dunlop-latex-29-ild',20],
   ['foamonline-high-resilience-medium-firm',20],
   ['cutfoam-eva75',5],
   ['foam-factory-super-soft',5]
  ]},
  {id:'hard',label:'Hard',layers:[
   ['foam-factory-dunlop-latex-29-ild',20],
   ['foamonline-high-resilience-extra-firm',20],
   ['cutfoam-eva240',5],
   ['foam-factory-super-soft',5]
  ]}
 ];
 let activePreset='medium';
 let layers=layersFromPreset(activePreset);
 let result=null;
 let calculation=0;

 function layersFromPreset(presetId){
  const preset=presets.find(item=>item.id===presetId);
  if(!preset)throw Error(`Unknown preset: ${presetId}`);
  return preset.layers.map(([foamId,thicknessMm],index)=>{
   if(!catalogById.has(foamId))throw Error(`Unknown foam: ${foamId}`);
   return {id:`layer-${index+1}`,foamId,thicknessMm,color:colors[index]};
  });
 }

 function number(value,digits=1){
  return Number(value).toLocaleString('en-CA',{maximumFractionDigits:digits});
 }

 function materialGroup(foam){
  if(foam.family==='EVA')return 'EVA';
  if(foam.family==='Latex')return 'Latex';
  if(/high[_ -]?resilience/i.test(foam.subtype))return 'High-resilience PU';
  return 'Other PU';
 }

 function materialType(foam){
  const subtype=foam.subtype.toLowerCase();
  if(foam.family==='EVA')return subtype.includes('eva_pe')?'Closed-cell EVA/PE':'Closed-cell EVA';
  if(foam.family==='Latex')return 'Dunlop latex';
  if(subtype.includes('high_resilience')||subtype.includes('high-resilience'))return 'High-resilience PU';
  if(subtype.includes('reticulated'))return 'Reticulated PU';
  if(subtype.includes('microcellular'))return 'Microcellular PU';
  return 'Conventional PU';
 }

 function materialOptions(selectedId){
  return materialGroups.map(group=>{
   const entries=catalogByGroup.get(group);
   return `<optgroup label="${esc(group)}">${entries.map(foam=>`<option value="${esc(foam.id)}" ${foam.id===selectedId?'selected':''}>${esc(foam.name)}</option>`).join('')}</optgroup>`;
  }).join('');
 }

 function firmnessText(foam){
  return foam.firmness.map(point=>`${number(point.value,2)} ${foam.firmnessUnits} at ${number(point.compressionPercent,1)}%`).join(', ');
 }

 function layerPosition(index){
  return ['Outside','Main cushion','Support','Hand comfort'][index];
 }

 function message(text){
  $('error').hidden=!text;
  $('error').textContent=text||'';
 }

 function readImpact(){
  const level=impactLevels[Number($('impact-level').value)];
  // Retain the existing energy reference points and Adult's original inputs.
  const mass=2.597;
  const speed=level.speed??Math.sqrt(2*level.energy/mass);
  return {mass,speed,energy:mass*speed*speed/2,label:level.label};
 }

 function renderImpact(){
  const impact=readImpact();
  $('impact-energy').textContent=number(impact.energy,1);
  $('impact-description').style.setProperty('--impact-position',Number($('impact-level').value)/(impactLevels.length-1));
  $('impact-level').setAttribute('aria-valuetext',impact.label);
  $('impact-points').innerHTML=impactLevels.map((item,index)=>`<span class="reference-point ${item.label===impact.label?'reference-point--active':''}" style="--position:${index*100/(impactLevels.length-1)}%"><span>${esc(item.label)}</span></span>`).join('');
 }

 function renderLayers(){
  const expanded=new Set([...$('layers').querySelectorAll('details[open]')].map(details=>details.closest('[data-layer]').dataset.layer));
  $('preset-buttons').innerHTML=presets.map(preset=>`<button data-preset="${preset.id}" class="${preset.id===activePreset?'active':''}" aria-pressed="${preset.id===activePreset}">${preset.label}</button>`).join('');
  $('total-thickness').textContent=number(layers.reduce((total,layer)=>total+layer.thicknessMm,0),0);
  $('layers').innerHTML=layers.map((layer,index)=>{
   const foam=catalogById.get(layer.foamId);
   return `<article class="layer" data-layer="${esc(layer.id)}">
    <div class="layer-title"><i class="swatch" style="--c:${layer.color}" aria-hidden="true"></i><strong>${esc(layerPosition(index))}</strong></div>
    <div class="field-grid">
     <label class="field">Material<select data-field="foamId">${materialOptions(layer.foamId)}</select></label>
     <label class="field">Thickness (mm)<input data-field="thicknessMm" type="number" min="1" step="1" inputmode="numeric" value="${layer.thicknessMm}"></label>
    </div>
    <details class="material-details" ${expanded.has(layer.id)?'open':''}>
    <summary>Material details</summary>
    <dl class="foam-data">
     <div><dt>Type</dt><dd>${esc(materialType(foam))}</dd></div>
     <div><dt>Density</dt><dd>${number(foam.densityKgM3,1)} kg/m³</dd></div>
     <div><dt>Firmness</dt><dd>${esc(firmnessText(foam))}</dd></div>
    </dl>
    </details>
   </article>`;
  }).join('');
 }

 function finite(value){
  return value!==null&&value!==''&&Number.isFinite(Number(value));
 }

 function value(value,digits=1,suffix=''){
  return finite(value)?`${number(Number(value),digits)}${suffix}`:'—';
 }

 function scaled(value,factor){
  return finite(value)?Number(value)*factor:null;
 }

 function resultRow(label,main,detail=''){
  return `<div class="result-row"><dt>${esc(label)}</dt><dd><strong>${esc(main)}</strong>${detail?` <small>(${esc(detail)})</small>`:''}</dd></div>`;
 }

 function foamShape(index,thicknessMm,color){
  // Simple sample blocks until the external foam geometry is available.
  const depth=Math.max(5,Math.min(24,thicknessMm));
  return `<svg class="foam-shape" viewBox="0 0 440 190" aria-hidden="true" focusable="false">
   <defs><linearGradient id="foam-surface-${index}" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".8"/></linearGradient></defs>
   <path d="M55 80 L220 138 V${138+depth} L55 ${80+depth} Z" fill="${color}" fill-opacity=".7" stroke="${color}"/>
   <path d="M220 138 L385 80 V${80+depth} L220 ${138+depth} Z" fill="${color}" fill-opacity=".5" stroke="${color}"/>
   <path d="M55 80 L220 22 L385 80 L220 138 Z" fill="url(#foam-surface-${index})" stroke="${color}" stroke-width="1"/>
  </svg>`;
 }

 function renderLayerResponse(components){
  return `<figure class="foam-response" aria-label="Foam layers and impact response">${layers.map((layer,index)=>{
   const component=components.find(item=>Number(item.layer)===index+1)||{};
   return `<div class="foam-response-layer" data-response-layer="${index+1}">
    ${foamShape(index,layer.thicknessMm,layer.color)}
    <div class="response-callout">
     <h3 class="response-title">${esc(layerPosition(index))}<span>${number(layer.thicknessMm,0)} mm</span></h3>
     <dl class="response-values">
      <div><dt>Compressed to</dt><dd>${value(component.remaining_mm,1,' mm')}</dd></div>
      <div><dt>Compression work</dt><dd>${value(component.work_j,1,' J')}</dd></div>
     </dl>
    </div>
   </div>`;
  }).join('')}</figure>`;
 }

 function renderResults(){
  if(!result){
   $('results').innerHTML='<p class="empty-state">Results will appear after simulation.</p>';
   return;
  }
  if(result.status==='error'){
   $('results').innerHTML=`<p class="result-status result-status--error">${esc(result.message||result.reason||'The simulation could not be completed.')}</p>`;
   return;
  }
  const metrics=result.metrics||{};
  const earlyMs=finite(metrics.early_time_s)?number(metrics.early_time_s*1000,1):'10';
  const earlyForce=finite(metrics.early_force_n)?metrics.early_force_n:metrics.force_at_early_time_n;
  const loadingWindow=finite(metrics.loading_rate_window_s)?`${number(metrics.loading_rate_window_s*1000,1)} ms window`:'';
  const thicknessDetail=[value(metrics.maximum_glove_compression_percent,1,'% compressed'),value(metrics.minimum_glove_thickness_mm,1,' mm remaining')].filter(item=>item!=='—').join(', ');
  const summaryRows=[
   resultRow('Peak force',value(scaled(metrics.peak_force_n,.001),2,' kN')),
   resultRow('Force at 5 ms',value(scaled(metrics.force_at_5ms_n,.001),2,' kN')),
   resultRow(`Force by ${earlyMs} ms`,value(scaled(earlyForce,.001),2,' kN'),value(metrics.early_force_percent_of_peak,1,'% of peak')),
   resultRow('Time to peak',value(scaled(metrics.time_to_peak_s,1000),2,' ms')),
   resultRow(`Energy remaining at ${earlyMs} ms`,value(metrics.kinetic_energy_at_early_time_j,1,' J'),value(metrics.kinetic_energy_at_early_time_percent,1,'%')),
   resultRow('10–90% loading rate',value(scaled(metrics.loading_rate_10_90_n_s,1e-6),2,' kN/ms')),
   resultRow('Peak loading rate',value(scaled(metrics.peak_loading_rate_n_s,1e-6),2,' kN/ms'),loadingWindow),
   resultRow('Loading impulse',value(metrics.loading_impulse_n_s,2,' N s')),
   resultRow('Maximum glove compression',value(metrics.maximum_glove_compression_mm,1,' mm'),thicknessDetail)
  ].join('');
  const components=Array.isArray(metrics.components)?metrics.components.filter(component=>component.role==='glove'):[];
  $('results').innerHTML=`${result.status==='incomplete'?`<p class="result-status">${esc(result.reason||'Simulation range ended before peak force.')}</p>`:''}<dl class="result-list">${summaryRows}</dl>${renderLayerResponse(components)}<p class="sample-weight"><span>Total sample weight (30 × 30 mm)</span><strong>${value(metrics.foam_sample_weight_g,2,' g')}</strong></p>`;
 }

 function linePath(points,x,y){
  return points.map((point,index)=>`${index?'L':'M'}${x(point.x).toFixed(2)},${y(point.y).toFixed(2)}`).join(' ');
 }

 function chartMarkup(series,rows,axes){
  const width=940,height=390,pad={left:58,right:58,top:32,bottom:64};
  const plotWidth=width-pad.left-pad.right,plotHeight=height-pad.top-pad.bottom;
  const endTime=Math.max(...rows.map(row=>Number(row.time_s)||0),.001);
  const leftMax=Math.max(...series.filter(item=>item.axis==='left').flatMap(item=>item.points.map(point=>point.y)),1);
  const rightMax=Math.max(...series.filter(item=>item.axis==='right').flatMap(item=>item.points.map(point=>point.y)),1);
  const x=value=>pad.left+(value/endTime)*plotWidth;
  const yLeft=value=>pad.top+plotHeight-(value/leftMax)*plotHeight;
  const yRight=value=>pad.top+plotHeight-(value/rightMax)*plotHeight;
  const ticks=[0,.25,.5,.75,1];
  const xLabels=ticks.map(tick=>`<text x="${x(endTime*tick)}" y="${height-36}" text-anchor="middle">${number(endTime*tick*1000,1)}</text>`).join('');
  const yLabels=ticks.map(tick=>`<text x="${pad.left-9}" y="${yLeft(leftMax*tick)+4}" text-anchor="end">${number(leftMax*tick,1)}</text><text x="${width-pad.right+9}" y="${yRight(rightMax*tick)+4}">${number(rightMax*tick,1)}</text>`).join('');
  const axisTitles=`<text class="chart-axis-title" x="${pad.left}" y="16">${esc(axes.left)}</text><text class="chart-axis-title" x="${width-pad.right}" y="16" text-anchor="end">${esc(axes.right)}</text><text class="chart-axis-title" x="${width/2}" y="${height-8}" text-anchor="middle">Time (ms)</text>`;
  const paths=series.map(item=>`<path class="chart-line" stroke="${item.color}" d="${linePath(item.points,x,item.axis==='right'?yRight:yLeft)}"/>`).join('');
  const early=Number(result?.metrics?.early_time_s)||.01;
  const marker=early<=endTime?`<line class="chart-marker" x1="${x(early)}" y1="${pad.top}" x2="${x(early)}" y2="${pad.top+plotHeight}"/><text x="${x(early)+5}" y="${pad.top+13}">${number(early*1000,1)} ms</text>`:'';
  const legend=series.map(item=>`<span class="legend-item"><i class="swatch" style="--c:${item.color}" aria-hidden="true"></i>${esc(item.label)}</span>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc($('graph-view').selectedOptions[0].textContent)} over impact time"><line class="chart-axis" x1="${pad.left}" y1="${pad.top+plotHeight}" x2="${width-pad.right}" y2="${pad.top+plotHeight}"/><line class="chart-axis" x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top+plotHeight}"/><line class="chart-axis" x1="${width-pad.right}" y1="${pad.top}" x2="${width-pad.right}" y2="${pad.top+plotHeight}"/>${axisTitles}${xLabels}${yLabels}${paths}${marker}</svg><div class="chart-legend">${legend}</div>`;
 }

 function renderGraph(){
  const rows=Array.isArray(result?.trace)?result.trace.filter(row=>finite(row.time_s)):[];
  if(rows.length<2){
   $('main-chart').innerHTML='<p class="empty-state">The impact trace will appear here.</p>';
   $('graph-caption').textContent='';
   return;
  }
  let series;
  let axes;
  if($('graph-view').value==='work'){
   axes={left:'Glove work (J)',right:'Speed (m/s)'};
   series=[
    {label:'Glove work',axis:'left',color:'#f3c75c',points:rows.map(row=>({x:Number(row.time_s),y:Number(row.glove_work_j)||0}))},
    {label:'Speed',axis:'right',color:'#67d4e8',points:rows.map(row=>({x:Number(row.time_s),y:Number(row.speed_m_s)||0}))}
   ];
   $('graph-caption').textContent='Glove work and striking speed over impact time.';
  }else{
   axes={left:'Remaining thickness (%)',right:'Force (kN)'};
   const totalThickness=layers.reduce((sum,layer)=>sum+layer.thicknessMm,0);
   const layerSeries=layers.map((layer,index)=>({
    label:layerPosition(index),axis:'left',color:layer.color,
    points:rows.map(row=>({x:Number(row.time_s),y:100*row.layers.slice(0,index+1).reduce((sum,item)=>sum+(Number(item.remaining_mm)||0),0)/totalThickness}))
   }));
   series=[...layerSeries,{label:'Force',axis:'right',color:'#ff995c',points:rows.map(row=>({x:Number(row.time_s),y:(Number(row.force_n)||0)/1000}))}];
   $('graph-caption').textContent='Layer curves show cumulative remaining thickness relative to the starting stack.';
  }
  $('main-chart').innerHTML=chartMarkup(series,rows,axes);
 }

 function commitResult(nextResult){
  result=nextResult;
  renderResults();
  renderGraph();
  $('results').removeAttribute('aria-busy');
  $('main-chart').removeAttribute('aria-busy');
 }

 function renderPending(){
  result=null;
  $('results').setAttribute('aria-busy','true');
  $('main-chart').setAttribute('aria-busy','true');
  if(!$('results').hasChildNodes())$('results').innerHTML='<p class="empty-state">Calculating…</p>';
  if(!$('main-chart').hasChildNodes())$('main-chart').innerHTML='<p class="empty-state">Building the impact trace…</p>';
 }

 async function runSimulation(){
  const requestNumber=++calculation;
  message('');
  const request=getRequest();
  renderPending();
  try{
   await new Promise(resolve=>setTimeout(resolve,0));
   const payload=globalThis.FoamSimulation.simulateFrontend(request,catalog);
   if(requestNumber!==calculation)return;
   commitResult(payload);
  }catch(error){
   if(requestNumber!==calculation)return;
   commitResult({status:'error',message:error.message||'Simulation unavailable.'});
  }
 }

 function getRequest(){
  const impact=readImpact();
  return {
   mass_kg:impact.mass,
   speed_m_s:impact.speed,
   layers:layers.map((layer,index)=>({layer:index+1,foam_id:layer.foamId,thickness_mm:layer.thicknessMm})),
   target:{...target}
  };
 }

 function update(){
  renderImpact();
  renderLayers();
  runSimulation();
 }

 $('impact-level').addEventListener('input',()=>{
  renderImpact();
  runSimulation();
 });
 $('preset-buttons').addEventListener('click',event=>{
  const button=event.target.closest('[data-preset]');
  if(!button)return;
  activePreset=button.dataset.preset;
  layers=layersFromPreset(activePreset);
  update();
 });
 $('layers').addEventListener('change',event=>{
  const card=event.target.closest('[data-layer]');
  const field=event.target.dataset.field;
  if(!card||!field)return;
  const layer=layers.find(item=>item.id===card.dataset.layer);
  if(field==='foamId')layer.foamId=event.target.value;
  if(field==='thicknessMm'){
   const thickness=Number(event.target.value);
   if(!Number.isInteger(thickness)||thickness<=0){message('Use a positive whole number of millimetres.');renderLayers();return;}
   layer.thicknessMm=thickness;
  }
  activePreset=null;
  update();
 });
 $('graph-view').addEventListener('change',()=>{if(result)renderGraph();});

 update();
})();
</script>
</body>
</html>
